<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dev Stack — explore technologies and build your ideal development stack." />
    <title>Dev Stack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --brand-gradient: linear-gradient(100deg,#ff6b1a 0%,#e62d8b 52%,#7447e8 100%); }
      html{scroll-behavior:smooth} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#111827;background:#fff}
      .gradient-text{background:var(--brand-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}.gradient-bg{background:var(--brand-gradient)}
      .section-shell{width:min(1100px,calc(100% - 32px));margin-inline:auto}.card-shadow{box-shadow:0 5px 18px rgba(17,24,39,.035)}
      @media (min-width:768px){.section-shell{width:min(1100px,calc(100% - 64px))}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The normal Vite/React app is used when served by Vite.
      // When this file is double-clicked (file://), a self-contained React fallback is loaded.
      if (location.protocol === 'file:') {
        document.write('<script src="https://unpkg.com/react@18/umd/react.development.js"><\/script>');
        document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>');
        document.write('<script src="https://unpkg.com/react-toastify@10/dist/react-toastify.min.js"><\/script>');
        document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
      }
    </script>
    <script type="module">
      if (location.protocol !== 'file:') {
        import('/src/main.jsx');
      }
    </script>
    <script type="text/babel">
      if (location.protocol === 'file:') {
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const data = [
          ['react','React','Frontend','A declarative, component-based JavaScript library for building modern user interfaces.','https://icon.icepanel.io/Technology/svg/React.svg',4.9,'Beginner-Friendly','Popular'],
          ['vue','Vue.js','Frontend','An approachable, performant, and versatile framework for building web interfaces.','https://icon.icepanel.io/Technology/svg/Vue.js.svg',4.8,'Beginner-Friendly','Versatile'],
          ['svelte','Svelte','Frontend','A compiler-based UI framework that turns components into efficient JavaScript at build time.','https://icon.icepanel.io/Technology/svg/Svelte.svg',4.8,'Intermediate','Fast'],
          ['nextjs','Next.js','Frontend','A React framework for full-stack web applications with hybrid rendering and server features.','https://icon.icepanel.io/Technology/svg/Next.js.svg',4.9,'Intermediate','Full Stack'],
          ['nodejs','Node.js','Backend','An asynchronous, event-driven JavaScript runtime built for scalable server applications.','https://icon.icepanel.io/Technology/svg/Node.js.svg',4.8,'Intermediate','Standard'],
          ['express','Express.js','Backend','A lightweight Node.js web framework for APIs, routing, middleware, and server-side applications.','https://icon.icepanel.io/Technology/svg/Express.svg',4.7,'Beginner-Friendly','API Ready'],
          ['postgresql','PostgreSQL','Database','A powerful open-source relational database known for reliability, extensibility, and SQL support.','https://icon.icepanel.io/Technology/svg/PostgresSQL.svg',4.9,'Intermediate','Top SQL'],
          ['mongodb','MongoDB','Database','A flexible document database designed for modern applications and rapidly changing data models.','https://icon.icepanel.io/Technology/svg/MongoDB.svg',4.8,'Intermediate','Flexible'],
          ['redis','Redis','Database','An in-memory data store commonly used for caching, sessions, queues, and fast application data.','https://icon.icepanel.io/Technology/svg/Redis.svg',4.8,'Intermediate','Cache'],
          ['javascript','JavaScript','Language','The versatile language that powers dynamic behavior across the modern web and server runtimes.','https://icon.icepanel.io/Technology/svg/JavaScript.svg',4.9,'Beginner-Friendly','Ubiquitous'],
          ['typescript','TypeScript','Language','A strongly typed superset of JavaScript that improves tooling, maintainability, and refactoring.','https://icon.icepanel.io/Technology/svg/TypeScript.svg',4.9,'Intermediate','Essential'],
          ['tailwind','Tailwind CSS','Styling','A utility-first CSS framework for rapidly creating responsive interfaces with reusable utility classes.','https://icon.icepanel.io/Technology/svg/Tailwind-CSS.svg',4.9,'Beginner-Friendly','Modern'],
          ['docker','Docker','DevOps','A container platform for packaging, sharing, and running applications consistently across environments.','https://icon.icepanel.io/Technology/svg/Docker.svg',4.9,'Intermediate','Containers'],
          ['git','Git','Tools','A distributed version control system for tracking code changes and collaborating safely on projects.','https://icon.icepanel.io/Technology/svg/Git.svg',4.9,'Beginner-Friendly','Must Have'],
          ['github','GitHub','Tools','A collaborative development platform for Git repositories, code review, issues, and project workflows.','https://icon.icepanel.io/Technology/svg/GitHub.svg',4.8,'Beginner-Friendly','Collaboration']
        ].map(([id,name,category,description,icon,rating,difficulty,badge])=>({id,name,category,description,icon,rating,difficulty,badge}));

        function notify(message, type='success') {
          const colors={success:'#16a34a',warning:'#d97706',info:'#2563eb'};
          const el=document.createElement('div');
          el.textContent=message;
          Object.assign(el.style,{position:'fixed',right:'20px',top:(20+document.querySelectorAll('.ds-toast').length*58)+'px',zIndex:9999,padding:'12px 16px',borderRadius:'8px',background:colors[type]||colors.info,color:'#fff',fontSize:'12px',fontWeight:'600',boxShadow:'0 8px 24px rgba(0,0,0,.15)',transition:'opacity .25s'});
          el.className='ds-toast'; document.body.appendChild(el); setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},2200);
        }

        function Navbar(){const [open,setOpen]=useState(false);const links=['Home','Technologies','Projects','About','Contact'];return <header className="sticky top-0 z-50 border-b border-slate-100 bg-white/95 backdrop-blur"><div className="section-shell relative flex h-16 items-center justify-between"><button className="flex h-9 w-9 items-center justify-center rounded-lg md:hidden" onClick={()=>setOpen(!open)}><span className="flex w-5 flex-col gap-1"><i className="h-0.5 w-full bg-slate-700"/><i className="h-0.5 w-full bg-slate-700"/><i className="h-0.5 w-full bg-slate-700"/></span></button><a href="#home" className="flex items-center gap-2"><span className="grid h-8 w-8 place-items-center rounded-lg gradient-bg text-[11px] font-extrabold text-white">DS</span><span className="text-[17px] font-bold">Dev <span className="gradient-text">Stack</span></span></a><nav className="absolute left-1/2 hidden -translate-x-1/2 items-center gap-8 md:flex">{links.map((x,i)=><a key={x} href={'#'+x.toLowerCase()} className={'text-[12px] font-medium '+(i===0?'text-pink-600':'text-slate-500')}>{x}</a>)}</nav><div className="flex items-center gap-3"><button className="hidden text-[12px] font-medium text-slate-600 sm:block">Sign In</button><button className="rounded-full gradient-bg px-5 py-2 text-[12px] font-semibold text-white">Sign Up</button></div>{open&&<div className="absolute left-0 right-0 top-16 border-b bg-white p-4 shadow-lg md:hidden"><nav className="flex flex-col gap-1">{links.map(x=><a key={x} onClick={()=>setOpen(false)} href={'#'+x.toLowerCase()} className="rounded-lg px-4 py-3 text-sm text-slate-600 hover:bg-slate-50">{x}</a>)}</nav></div>}</div></header>}

        function Hero(){return <section id="home" className="section-shell grid min-h-[455px] items-center gap-8 py-12 md:grid-cols-[1.15fr_.85fr] md:py-16"><div><h1 className="max-w-[620px] text-4xl font-extrabold leading-tight tracking-tight text-slate-900 sm:text-5xl">Build Your Ideal<span className="block gradient-text">Development Stack</span></h1><p className="mt-5 max-w-[570px] text-[14px] leading-6 text-slate-500">Explore frontend, backend, database, and tooling options, compare them side by side, and put together the stack that fits your next project.</p><div className="mt-7 flex flex-wrap gap-3"><a href="#technologies" className="rounded-lg gradient-bg px-4 py-3 text-xs font-semibold text-white">Explore Technologies</a><a href="#about" className="rounded-lg border border-slate-200 px-7 py-3 text-xs font-medium text-slate-600">Learn More</a></div></div><div className="flex justify-center md:justify-end"><img src="src/assets/hero-illustration.svg" alt="Development illustration" className="w-[280px] sm:w-[350px] md:w-[390px]"/></div></section>}

        function Card({t,added,onAdd}){return <article className="card-shadow flex min-h-[254px] flex-col rounded-xl border border-slate-100 bg-white p-5 transition hover:-translate-y-0.5"><div className="flex items-start justify-between"><img src={t.icon} alt={t.name} className="h-8 w-8 object-contain"/><span className="rounded-full bg-slate-50 px-2.5 py-1 text-[9px] font-semibold text-slate-500">{t.badge}</span></div><h3 className="mt-3 text-[16px] font-bold text-slate-800">{t.name}</h3><p className="mt-2 line-clamp-3 text-[11px] leading-[1.55] text-slate-400">{t.description}</p><div className="mt-auto pt-4"><div className="mb-3 flex items-center justify-between text-[10px]"><span className="rounded bg-slate-50 px-2 py-1 text-slate-500">{t.category}</span><span className="text-slate-400">{t.difficulty}</span><span className="font-semibold text-slate-500"><span className="text-amber-400">★</span> {t.rating}</span></div><button disabled={added} onClick={()=>onAdd(t)} className={'w-full rounded-md px-3 py-2.5 text-[11px] font-semibold '+(added?'cursor-not-allowed bg-slate-100 text-slate-400':'bg-slate-950 text-white hover:bg-slate-800')}>{added?'✓ Added to Stack':'Add to Stack'}</button></div></article>}

        function Stack({stack,onRemove,onRemoveAll}){return <aside className="h-fit rounded-xl border border-slate-100 bg-white p-4 shadow-sm md:sticky md:top-[88px]"><h2 className="text-sm font-bold text-slate-800">Your Stack</h2><p className="mt-1 text-[10px] text-slate-400">{stack.length} Technology{stack.length===1?'':'ies'} Selected</p>{!stack.length?<div className="mt-4 grid min-h-[82px] place-items-center rounded-lg border border-dashed border-slate-200 text-center text-[11px] text-slate-400">Your stack is empty.</div>:<><div className="mt-4 space-y-2">{stack.map(x=><div key={x.id} className="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2"><img src={x.icon} className="h-7 w-7 object-contain"/><div className="min-w-0 flex-1"><p className="truncate text-[11px] font-semibold text-slate-800">{x.name}</p><p className="text-[8px] text-slate-400">{x.category}</p></div><button onClick={()=>onRemove(x.id)} className="px-1 text-xl text-slate-400">×</button></div>)}</div><button onClick={onRemoveAll} className="mt-5 w-full rounded-md border border-red-200 py-2.5 text-[11px] font-semibold text-red-500">Remove All</button></>}</aside>}

        function Technologies(){const [stack,setStack]=useState([]);const [loading,setLoading]=useState(true);useEffect(()=>{setTimeout(()=>setLoading(false),300)},[]);const add=t=>{if(stack.some(x=>x.id===t.id)){notify(t.name+' is already in your stack.','warning');return}setStack(s=>[...s,t]);notify(t.name+' added to your stack.','success')};const remove=id=>{const x=stack.find(a=>a.id===id);setStack(s=>s.filter(a=>a.id!==id));if(x)notify(x.name+' removed from your stack.','info')};const clear=()=>{if(stack.length){setStack([]);notify('Your stack has been cleared.','info')}};return <section id="technologies" className="section-shell scroll-mt-20 pb-20"><div className="mb-7"><h2 className="text-2xl font-extrabold">Explore the <span className="gradient-text">Technologies</span></h2><p className="mt-2 text-[12px] text-slate-400">Pick technologies to build your ideal stack.</p></div>{loading?<div className="flex min-h-[350px] items-center justify-center text-sm text-slate-400">Loading technologies...</div>:<div className="grid items-start gap-5 lg:grid-cols-[1fr_230px]"><div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">{data.map(t=><Card key={t.id} t={t} added={stack.some(x=>x.id===t.id)} onAdd={add}/>)}</div><Stack stack={stack} onRemove={remove} onRemoveAll={clear}/></div>}</section>}

        function Footer(){return <footer className="border-t border-slate-100 bg-white"><div className="section-shell grid gap-10 py-12 md:grid-cols-[1.7fr_1fr_1fr_1fr]"><div><div className="flex items-center gap-2"><span className="grid h-7 w-7 place-items-center rounded-md gradient-bg text-[9px] font-extrabold text-white">DS</span><span className="text-[15px] font-bold">Dev <span className="gradient-text">Stack</span></span></div><p className="mt-4 max-w-[290px] text-[11px] leading-5 text-slate-400">Curated tools, technologies, and resources for developers building modern software.</p><div className="mt-4 flex gap-4 text-[10px] text-slate-500"><a href="https://github.com">GitHub</a><a href="https://twitter.com">Twitter</a><a href="https://linkedin.com">LinkedIn</a></div></div>{[['Product',['Home','Technologies','Projects']],['Company',['About','Contact','Careers']],['Legal',['Privacy Policy','Terms of Service']]].map(([title,items])=><div key={title}><h3 className="text-[10px] font-bold uppercase tracking-wider text-slate-700">{title}</h3><div className="mt-4 space-y-3 text-[10px] text-slate-400">{items.map(x=><a key={x} className="block" href="#">{x}</a>)}</div></div>)}</div><div className="section-shell flex flex-col gap-3 border-t border-slate-100 py-5 text-[9px] text-slate-300 sm:flex-row sm:justify-between"><span>© 2026 Dev Stack. All rights reserved.</span><span>Privacy · Terms</span></div></footer>}

        function App(){return <><Navbar/><main><Hero/><Technologies/><section id="projects"/><section id="about"/></main><Footer/></>}
        createRoot(document.getElementById('root')).render(<App/>);
      }
    </script>
  </body>
</html>
